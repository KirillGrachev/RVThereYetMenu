; RVThereYetMenu configuration.
; Changes made in the menu (slot slider, language) rewrite this file.

[Menu]
; Menu open/close key. Both UE-style names (INSERT, DELETE, ENTER) and
; raw UE4SS VK names (INS, DEL, RETURN) are accepted; case-insensitive.
ToggleKey = INSERT
; Interface language: ru | en
Language = ru

[Session]
; Session player cap (vanilla 4, hard limit 24). Applies on the host;
; clients do not need the mod.
MaxPlayers = 8
; Re-apply the cap to every newly created GameSession
; (true - the MoreRVers default behaviour).
AutoApplySlots = true

[Logging]
; DEBUG | INFO | WARN | ERROR
Level = INFO
