; Конфигурация RVThereYetMenu.
; Изменения из меню (слайдер слотов, язык) перезаписывают этот файл.

[Menu]
; Клавиша открытия/закрытия меню — имя из таблицы Key UE4SS
; (INSERT, F5, HOME, ...). Регистр не важен.
ToggleKey = INSERT
; Язык интерфейса: ru | en
Language = ru

[Session]
; Кап игроков сессии (ваниль 4, предел 24). Применяется к хосту;
; клиентам мод не нужен.
MaxPlayers = 8
; Автоматически применять кап к каждой новой GameSession
; (true — как MoreRVers по умолчанию).
AutoApplySlots = true

[Logging]
; DEBUG | INFO | WARN | ERROR
Level = INFO
