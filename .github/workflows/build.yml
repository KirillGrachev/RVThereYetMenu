name: build

on:
  push:
    branches: [ main ]
  pull_request:
  release:
    types: [ published ]

jobs:
  lua:
    name: Lua - линт и тесты
    runs-on: ubuntu-latest
    steps:
      - name: Чекаут репозитория
        uses: actions/checkout@v4

      - name: Установка lua5.4 и luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 lua-check

      - name: Проверка синтаксиса (luac -p)
        run: find mod tests/lua -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p

      - name: Линт luacheck
        run: luacheck mod tests/lua --config .luacheckrc

      - name: Тесты чистой Lua-логики
        run: lua5.4 tests/lua/run_tests.lua

  dotnet:
    name: .NET - инструменты и тесты
    runs-on: ubuntu-latest
    steps:
      - name: Чекаут репозитория
        uses: actions/checkout@v4

      - name: Установка .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Сборка tools (AssetIndex, AssetDump, NameCheck)
        run: |
          dotnet build -c Release tools/AssetIndex
          dotnet build -c Release tools/AssetDump
          dotnet build -c Release tools/NameCheck

      - name: Тесты NameCheck (xunit)
        run: dotnet test -c Release tests/NameCheck.Tests --nologo

      - name: NameCheck end-to-end на синтетических фикстурах
        # Игровые дампы в репозиторий не входят (см. .gitignore), поэтому
        # сквозной прогон валидатора выполняется на мини-наборе
        # tests/fixtures: те же форматы assets.txt / dumps / refs.lua.
        run: |
          dotnet run -c Release --project tools/NameCheck -- \
            --refs tests/fixtures/refs.lua \
            --assets tests/fixtures/assets.txt \
            --dumps tests/fixtures/dumps

  release:
    name: Релиз - сборка ModOnly zip
    if: github.event_name == 'release'
    needs: [ lua, dotnet ]
    runs-on: ubuntu-latest
    steps:
      - name: Чекаут репозитория
        uses: actions/checkout@v4

      - name: Упаковка мода (Mods + UE4SS_Signatures)
        run: |
          cd mod
          zip -r "../RVThereYetMenu-${{ github.event.release.tag_name }}-ModOnly.zip" \
            Mods UE4SS_Signatures

      - name: Прикрепить архив к релизу
        uses: softprops/action-gh-release@v2
        with:
          files: RVThereYetMenu-*-ModOnly.zip
